name: astrbot_plugin_context_aware
display_name: 上下文场景感知增强
desc: 增强 LLM 对群聊场景的理解能力，让 Bot 知道谁在和谁说话，可完全替代框架内置的群聊上下文感知功能
help: |
  ⚠️ 重要：安装本插件后，请关闭 AstrBot 内置的「群聊上下文感知(原聊天记忆增强)」功能！
  否则会导致 LLM 收到两份群聊记录，造成上下文膨胀。

  本插件通过分析群聊消息结构，为 LLM 提供结构化的场景描述，包括：
  - 触发类型：被@、被回复、唤醒词、主动搭话、戳一戳等
  - 对话对象：当前消息是对谁说的（关键功能）
  - 对话流：最近的对话结构和走向
  - Bot状态：上次发言时间
  - 图像转述：可选功能，将群友发送的图片转为文字描述

  v3.4.3 更新：
  - [FIX] LLM 请求图片预处理覆盖持久化历史 contexts，避免旧图片绕过压缩链
  - [FIX] GIF 提取首帧为 PNG 临时副本，兼容不支持 image/gif 的模型

  v3.4.2 更新：
  - [FIX] 引用消息中的图片文件按真实内容归一化为 Image，避免重复回查 OneBot
  - [FEAT] 自动支持 Pillow 可识别的 PNG、JPEG、WebP、GIF、BMP、TIFF、ICO 等格式

  v3.1.6 更新：
  - [FIX] 语音转写独立上下文窗口，避免高频群聊把未回复语音挤出最近对话流
  - [CONFIG] 新增 voice_context_window，默认从最近 50 条消息中单独提取语音转写

  v3.1.5 更新：
  - [FIX] 兼容 Gemini_STT 语音转写上下文，记录为普通群聊消息
  - [FIX] 按消息 ID 幂等写入，避免 LLM 请求兜底记录和消息 handler 重复记录同一条语音

  v3.1.4 更新：
  - [FIX] 最近图片上下文支持过滤 GIF，避免不支持 image/gif 的模型在后续请求中报错
  - [CONFIG] 新增 show_recent_images_allow_gif 开关，默认不将 GIF 加入 <recent_images>

  v3.1.3 更新：
  - [FIX] 图片上下文记录只扩展到图片概要，避免纯表情/@/引用等占位消息污染对话流
  - [CHANGE] 最低 AstrBot 版本提高到 4.24.0，确保临时注入不会写入会话历史

  v3.0.0 重大更新（精品重构）：
  - [CRITICAL] 修复并发竞态：SessionManager 添加异步锁 + deque 自动裁剪
  - [HIGH] 图像转述优化：并发限流(Semaphore) + 超时控制 + URL缓存
  - [HIGH] 修复封装破坏：SceneAnalyzer 添加 bot_id 只读属性
  - [HIGH] 消除魔法字符串：集中定义 ExtraKeys 常量类
  - [HIGH] 安全注入场景：防止重复注入 + 兼容处理
  - [HIGH] 对话推断增强：关键锚点分离 + 推断原因追踪
  - [MEDIUM] 配置工具方法：_cfg_int/_cfg_bool/_cfg_list
  - [MEDIUM] 回复特征词可配置化
  - [MEDIUM] 增强可观测性：推断规则调试日志
  - [LOW] 修复时间戳精度：使用 uuid

  v2.5.1 更新：
  - 新增公开 API：remove_message() 和 remove_last_bot_response()
  - 支持 recall_cancel 插件联动清理撤回消息的上下文记录

  v2.5.0 更新：
  - 新增戳一戳触发类型（TRIGGER_POKE）
  - 支持 poke_to_llm 插件的 _poke_trigger 标记
  - 戳一戳时正确显示戳一戳用户信息

  v2.4.0 更新：
  - 新增图像转述功能，可将群友发送的图片转为文字描述
  - 支持下拉选择图像转述提供商
  - 完善文档，明确说明需关闭框架内置 LTM

  v2.3.0 更新：
  - 修复回复词推断误判
  - 增加 Bot 回复对象追踪
  - 优化 TRIGGER_UNKNOWN 处理

  特点：
  - 可完全替代框架内置 LTM 的群聊记录功能
  - 只做加法，不修改框架原有信息
  - 轻量快速，图像转述为可选功能
  - v3.0.0: 并发安全、高性能、可观测

  v3.3.1 更新：
  - [FIX] 修复 issue #1：平台以 base64 data URI 传入图片时触发 [Errno 36] File name too long
    data URI 现在会先解码落盘再送视觉模型，同时用哈希作为缓存键避免超大 key 占内存
  - [FIX] lazy 模式 _download_image_to_local 同样支持 data URI 输入

  v3.3.0 更新：
  - [FEAT] 新增 lazy 图像转述模式（image_caption_lazy）：图片到达时仅记录占位，
    只在 LLM 真正需要用到该图片时才调用视觉模型，避免对无关图片浪费视觉 API 调用
  - [FEAT] 新增图片本地缓存（image_cache_dir / image_download_max_bytes / image_cache_ttl）：
    收到图片时提前下载到本地，防止 QQ CDN 等临时链接在 lazy caption 阶段过期失效
  - [FIX] 图像转述失败时写入哨兵缓存，避免同一失败 URL 反复重试

  v3.2.0 更新：
  - [FIX] 收紧规则4时间窗口（35s→20s），降低高频群聊中短确认词被误判为回复Bot的概率
  - [FIX] 规则4新增"他人正在对话中"保护：最近60秒内有其他人主动和当前用户说话时，不推断为回复Bot
  - [REMOVE] 删除规则6（快速连续对话推断）：该规则在群聊中增加推断复杂度，已移除
  - [FIX] 强化主动触发+Bot推断场景的 instruction，LLM 现在会更保守地判断是否需要回复
  - [CONFIG] 新增 strict_mode：开启后主动/未知触发场景强制不推断 talking_to=bot，彻底减少误回复

  v3.4.0 更新：
  - [FEAT] 新增可选、可调的 LLM 请求图片压缩，仅生成临时副本，不修改原图
  - [FIX] QQ CDN 下载增加完整性校验、重试和失败缓存，降低引用大图时的下载中断概率
  - [FIX] `/reset` 和 `/new` 在记录消息前清空插件上下文，兼容第三方 Agent runner
  - [FIX] 兼容 `astrbot_plugin_cmdmask` 伪装指令，通过其 target extra 识别真实命令

  配置说明请查看插件配置页面。
version: 3.4.3
author: 木有知
repo: https://github.com/muyouzhi6/astrbot_plugin_context_aware
astrbot_version: ">=4.24.0"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - discord
  - slack
  - kook
  - lark
  - satori
  - misskey
  - line
