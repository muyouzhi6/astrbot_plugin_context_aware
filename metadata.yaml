name: astrbot_plugin_context_aware
display_name: 上下文场景感知增强
desc: 群聊场景和图片回看增强；可选私聊长话题记忆，后台整理约定与进度，支持备用模型和重启恢复
help: |
  群聊场景分析
  - 识别 @、引用回复、昵称唤醒、主动搭话等触发方式。
  - 分析发言对象和近期对话关系，减少 Bot 对非目标消息的误回复。
  - 提供可选的群聊历史摘要；启用场景功能时，建议关闭 AstrBot 内置群聊上下文感知，避免重复记录。

  图片与语音上下文
  - 支持近期图片索引、按需回看、图片压缩和已有语音转写的上下文补充。
  - 图片回看需要模型支持相应能力，具体要求见 README。

  私聊上下文
  - 私聊发送“短期记忆”查看当前会话最近一次请求的实际注入内容，不调用模型。
  - 可选记录注入正文到日志，默认关闭；日志可能包含私聊内容。
  - 场景提示和话题摘要分别配置，位于配置面板末尾。
  - 话题摘要默认关闭，启用后在后台整理用户约束、修正、决定和待办。
  - 支持继承当前会话的模型与备用列表，或单独指定摘要模型。
  - 摘要失败保留已有数据，不阻塞主对话；本地数据支持重启恢复及会话隔离。
  - 额外模型调用可能产生费用。文本原文默认保留 30 天，无法恢复启用前已删除的历史。
  - 可独立使用，无需安装其他长期记忆插件。

  完整功能、配置与兼容性说明见 README。
version: 3.7.1
author: 木有知
repo: https://github.com/muyouzhi6/astrbot_plugin_context_aware
astrbot_version: ">=4.26.8"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - discord
  - slack
  - kook
  - lark
  - satori
  - misskey
  - line
